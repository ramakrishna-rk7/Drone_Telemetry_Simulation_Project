<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Telemetry Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    padding: 30px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #38bdf8;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.metric {
    font-size: 28px;
    font-weight: bold;
}

.battery-container {
    width: 100%;
    height: 22px;
    background: #334155;
    border-radius: 50px;
    overflow: hidden;
    margin: 10px 0;
}

.battery-bar {
    height: 100%;
    width: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    transition: width 0.5s ease, background 0.5s ease;
}

.warning {
    color: #f87171;
    font-weight: bold;
    font-size: 14px;
}

.chart-container {
    max-width: 1200px;
    margin: 40px auto;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<h1>🚁 Drone Telemetry Dashboard</h1>

<div class="dashboard">

    <div class="card">
        <h3>Altitude</h3>
        <div id="altitude" class="metric">0 m</div>
    </div>

    <div class="card">
        <h3>Speed</h3>
        <div id="speed" class="metric">0 m/s</div>
    </div>

    <div class="card">
        <h3>Battery</h3>
        <div class="battery-container">
            <div id="batteryBar" class="battery-bar"></div>
        </div>
        <div id="batteryText" class="metric">100%</div>
        <div id="warning" class="warning"></div>
    </div>

    <div class="card">
        <h3>GPS Coordinates</h3>
        <div id="gps" class="metric">0, 0</div>
    </div>

</div>

<div class="chart-container">
    <canvas id="telemetryChart"></canvas>
</div>

<script>
let altitude = 100;
let speed = 10;
let battery = 100;
let latitude = 37.7749;
let longitude = -122.4194;
let timeElapsed = 0;

const ctx = document.getElementById('telemetryChart').getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Altitude (m)',
                data: [],
                borderColor: '#3b82f6',
                backgroundColor: '#3b82f6',
                borderWidth: 3,
                tension: 0.3,
                pointRadius: 3,
                yAxisID: 'y1'
            },
            {
                label: 'Speed (m/s)',
                data: [],
                borderColor: '#ef4444',
                backgroundColor: '#ef4444',
                borderWidth: 3,
                borderDash: [6,6],
                tension: 0.3,
                pointRadius: 3,
                yAxisID: 'y2'
            }
        ]
    },
    options: {
        responsive: true,
        interaction: {
            mode: 'index',
            intersect: false
        },
        plugins: {
            legend: {
                labels: {
                    color: '#ffffff',
                    font: { size: 14 }
                }
            }
        },
        scales: {
            x: {
                ticks: { color: '#cbd5e1' },
                grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y1: {
                type: 'linear',
                position: 'left',
                ticks: { color: '#3b82f6' },
                grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y2: {
                type: 'linear',
                position: 'right',
                ticks: { color: '#ef4444' },
                grid: { drawOnChartArea: false }
            }
        }
    }
});

function updateTelemetry() {

    if (timeElapsed >= 30) {
        clearInterval(simulation);
        alert("🛬 Simulation Complete!");
        return;
    }

    timeElapsed++;

    altitude += (Math.random() * 5 - 2);
    speed += (Math.random() * 2 - 1);
    battery -= (Math.random() * 1.2);

    latitude += (Math.random() * 0.0001 - 0.00005);
    longitude += (Math.random() * 0.0001 - 0.00005);

    altitude = Math.max(0, altitude);
    speed = Math.max(0, speed);
    battery = Math.max(0, battery);

    document.getElementById("altitude").innerText = altitude.toFixed(2) + " m";
    document.getElementById("speed").innerText = speed.toFixed(2) + " m/s";
    document.getElementById("gps").innerText =
        latitude.toFixed(6) + ", " + longitude.toFixed(6);

    document.getElementById("batteryBar").style.width = battery + "%";
    document.getElementById("batteryText").innerText = battery.toFixed(1) + "%";

    if (battery <= 20) {
        document.getElementById("batteryBar").style.background =
            "linear-gradient(90deg,#ef4444,#dc2626)";
        document.getElementById("warning").innerText = "⚠ LOW BATTERY!";
    }

    chart.data.labels.push(timeElapsed);
    chart.data.datasets[0].data.push(altitude);
    chart.data.datasets[1].data.push(speed);
    chart.update();
}

const simulation = setInterval(updateTelemetry, 1000);

</script>

</body>
</html>
